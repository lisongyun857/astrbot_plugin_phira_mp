name: astrbot_plugin_phira_mp
display_name: Phira 多人服务器助手
short_desc: 用 /p 指令查询和管理 Phira 多人服务器
desc: |
  将 phira-mp-node（Phira 多人服务器）的房间查询、服务器状态、建房、删房、管理消息与公告接入 AstrBot。
  指令统一以 /p 开头，支持 /p房间 和 /p 房间 两种写法。
  服务端需要启用 HTTP API，并在插件中配置 API 地址、访问令牌和管理员 QQ。
version: 1.0.0
author: lisongyun857
repo: https://github.com/lisongyun857/astrbot_plugin_phira_mp
astrbot_version: ">=4.0.0"
support_platforms:
  - aiocqhttp
social_link: https://github.com/lisongyun857
tags:
  - phira
  - rhythm-game
  - server-management
  - qq
